name: 國際台股聯動日報

on:
  schedule:
    # 台北時間週一至週五 05:13（UTC 前一天 21:13）。GitHub 排程常延遲，提早排以確保開盤前送達
    - cron: '13 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/data_fetcher.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/market_analyzer.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python scripts/tts_generator.py
        env:
          GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
      - run: python scripts/telegram_sender.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  keepalive:
    # 防止 60 天無 commit 被 GitHub 自動停用排程
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
